[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flowoox-mcp-example"
version = "0.1.0"
description = "Template for a typed Flowoox MCP service."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "mcp>=1.28.1,<2",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
mcp-example = "example_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/example_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
