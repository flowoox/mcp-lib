[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-lib"
version = "0.1.0"
description = "Containerized MCP servers and control plane for Spotify taste discovery, slskd album-folder downloads, and Traxx/BeMusic imports."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "flowoox"}]
dependencies = [
  "apscheduler>=3.11,<4",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "mcp>=1.28.1,<2",
  "mutagen>=1.47,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
mcp-soulseek = "mcp_lib.mcp_soulseek:main"
mcp-traxx = "mcp_lib.mcp_traxx:main"
music-control-plane = "mcp_lib.control_plane:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_lib"]
include = [
  "src/mcp_lib/templates/**",
  "src/mcp_lib/static/**",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
