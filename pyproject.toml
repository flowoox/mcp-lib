[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-lib"
version = "0.2.0"
description = "Reusable, independently deployable MCP services for Soulseek/slskd and Traxx/BeMusic."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "flowoox"}]
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.28.1,<2",
  "mutagen>=1.47,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
mcp-soulseek = "mcp_lib.mcp_soulseek:main"
mcp-traxx = "mcp_lib.mcp_traxx:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_lib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
