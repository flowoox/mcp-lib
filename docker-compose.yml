name: mcp-lib

services:
  mcp-soulseek:
    build:
      context: .
      target: soulseek
    image: ghcr.io/flowoox/mcp-soulseek:${MCP_IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8081
      STATE_DB: /data/soulseek-mcp.sqlite3
      DOWNLOADS_DIR: /downloads
      SLSKD_URL: http://slskd:5030
    volumes:
      - soulseek-mcp-state:/data
      - downloads:/downloads
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - music-automation
    depends_on:
      slskd:
        condition: service_started

  mcp-traxx:
    build:
      context: .
      target: traxx
    image: ghcr.io/flowoox/mcp-traxx:${MCP_IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8082
      DOWNLOADS_DIR: /downloads
    volumes:
      - downloads:/downloads:ro
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - music-automation

  slskd:
    image: slskd/slskd:latest
    restart: unless-stopped
    environment:
      SLSKD_REMOTE_CONFIGURATION: "false"
      SLSKD_SHARED_DIR: /music
      SLSKD_DOWNLOADS_DIR: /downloads
      SLSKD_INCOMPLETE_DIR: /incomplete
      SLSKD_SLSK_USERNAME: ${SLSKD_SLSK_USERNAME}
      SLSKD_SLSK_PASSWORD: ${SLSKD_SLSK_PASSWORD}
      SLSKD_SLSK_LISTEN_PORT: ${SLSKD_SLSK_LISTEN_PORT:-50300}
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      SLSKD_USERNAME: ${SLSKD_USERNAME:-admin}
      SLSKD_PASSWORD: ${SLSKD_PASSWORD}
    volumes:
      - slskd-state:/app
      - downloads:/downloads
      - incomplete:/incomplete
      - shares:/music:ro
    ports:
      - "127.0.0.1:5030:5030"
      - "${SLSKD_SLSK_LISTEN_PORT:-50300}:${SLSKD_SLSK_LISTEN_PORT:-50300}"
    networks:
      - music-automation

volumes:
  soulseek-mcp-state:
  slskd-state:
  downloads:
  incomplete:
  shares:

networks:
  music-automation:
    driver: bridge
