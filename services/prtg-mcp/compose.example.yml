services:
  mcp-prtg:
    build:
      context: ../..
      dockerfile: services/prtg-mcp/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - .env
    restart: unless-stopped
