[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flowoox-mcp-docker"
version = "0.1.0"
description = "Product-neutral MCP service for bounded read-only Docker diagnostics."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "flowoox-mcp-common>=0.2.0",
  "httpx>=0.28,<1",
  "mcp>=1.28.1,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[project.scripts]
mcp-docker = "docker_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docker_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../packages/mcp-common/src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
