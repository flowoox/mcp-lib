services:
  mcp-freshdesk:
    build:
      context: ../..
      dockerfile: services/freshdesk-mcp/Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:8096:8096"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
