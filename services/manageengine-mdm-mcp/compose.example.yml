services:
  mcp-manageengine-mdm:
    build:
      context: ../..
      dockerfile: services/manageengine-mdm-mcp/Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:8095:8095"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
