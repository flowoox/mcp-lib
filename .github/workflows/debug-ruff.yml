name: Debug Ruff imports

on:
  pull_request:
    paths:
      - "packages/mcp-common/src/mcp_common/mcp_security.py"
      - ".github/workflows/debug-ruff.yml"

permissions:
  contents: read

jobs:
  imports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.3"
      - name: Show canonical import patch
        run: |
          ruff check --select I --fix packages/mcp-common/src/mcp_common/mcp_security.py
          git diff -- packages/mcp-common/src/mcp_common/mcp_security.py
