name: Publish Soulseek MCP

on:
  push:
    branches: [main]
    paths:
      - services/soulseek-mcp/**
      - packages/mcp-common/**
      - .github/workflows/publish-soulseek.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-soulseek-mcp
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  VERSION: 0.3.1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish canonical image and compatibility alias
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/soulseek-mcp/Dockerfile
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/flowoox/mcp-soulseek:${{ env.VERSION }}
            ghcr.io/flowoox/mcp-soulseek:latest
            ghcr.io/flowoox/mcp-soulseek:sha-${{ github.sha }}
            ghcr.io/flowoox/mcp-spulseek:${{ env.VERSION }}
            ghcr.io/flowoox/mcp-spulseek:latest
            ghcr.io/flowoox/mcp-spulseek:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=soulseek-mcp
          cache-to: type=gha,mode=max,scope=soulseek-mcp
