name: Bootstrap modular MCP source tree

on:
  push:
    branches:
      - feat/modular-mcp-services-v0.1.0
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and reconstruct repository
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* | base64 --decode > /tmp/source.tar.gz
          echo "b1a3ba3469734ccff7f6a1485b7e2c5b93c49f9a6da0c788cbcce719d05944f1  /tmp/source.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/source.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: split Soulseek and Traxx MCP services"
          git push origin "HEAD:${GITHUB_REF_NAME}"
