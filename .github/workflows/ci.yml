name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mcp-lib-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SBOM_GENERATOR: docker.io/docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

jobs:
  actions-policy:
    name: GitHub Actions pin policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject mutable third-party Action references
        run: python scripts/check_actions_pins.py
      - name: Reject transitive publisher bootstrap regression
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'docker/setup-(buildx|qemu)-action@' .github/workflows; then
            echo 'setup-buildx/setup-qemu Actions reintroduce transitive executable bootstrap' >&2
            exit 1
          fi
          if grep -R -nE '^[[:space:]]+sbom:[[:space:]]+(true|yes)[[:space:]]*$' \
            .github/workflows/publish-archive.yml \
            .github/workflows/publish-soulseek.yml \
            .github/workflows/publish-traxx.yml; then
            echo 'boolean SBOM shorthand would restore the mutable default scanner alias' >&2
            exit 1
          fi
          grep -Fq 'BUILDX_LINUX_AMD64_SHA256="48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778"' scripts/bootstrap-buildx-secure.sh
          grep -Fq 'BUILDKIT_IMAGE="docker.io/moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8"' scripts/bootstrap-buildx-secure.sh
          for workflow in .github/workflows/publish-archive.yml .github/workflows/publish-soulseek.yml .github/workflows/publish-traxx.yml; do
            grep -Fq 'persist-credentials: false' "$workflow"
            grep -Fq 'run: bash scripts/bootstrap-buildx-secure.sh' "$workflow"
            grep -Fq "github-token: ''" "$workflow"
            grep -Fq 'builder:' "$workflow"
            grep -Fq 'steps.buildx.outputs.builder' "$workflow"
            grep -Fq 'SBOM_GENERATOR: docker.io/docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9' "$workflow"
            grep -Fq 'type=provenance,mode=max' "$workflow"
            grep -Fq 'type=sbom,generator=' "$workflow"
          done

  publisher-bootstrap:
    name: Verified publisher bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bootstrap pinned Buildx and BuildKit
        id: buildx
        shell: bash
        run: bash scripts/bootstrap-buildx-secure.sh
      - name: Verify pinned builder is usable
        shell: bash
        env:
          BUILDER: ${{ steps.buildx.outputs.builder }}
        run: |
          set -euo pipefail
          test -n "$BUILDER"
          docker buildx inspect "$BUILDER" --bootstrap
      - name: Generate SBOM with immutable scanner
        shell: bash
        env:
          BUILDER: ${{ steps.buildx.outputs.builder }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mcp-lib-sbom
          docker buildx build \
            --builder "$BUILDER" \
            --file services/archive-mcp/Dockerfile \
            --attest "type=sbom,generator=${SBOM_GENERATOR}" \
            --output type=local,dest=/tmp/mcp-lib-sbom \
            .
          test -s /tmp/mcp-lib-sbom/sbom.spdx.json
          grep -Fq 'SPDX' /tmp/mcp-lib-sbom/sbom.spdx.json
      - name: Remove ephemeral Buildx builder
        if: always()
        shell: bash
        env:
          BUILDER: ${{ steps.buildx.outputs.builder }}
        run: |
          if [[ -n "$BUILDER" ]]; then
            docker buildx rm --force "$BUILDER" || true
          fi

  common:
    name: mcp-common tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: constraints/python312.lock
      - name: Install locked dependency graph
        run: |
          python -m pip install --constraint constraints/python312.lock --upgrade pip
          python -m pip install --constraint constraints/python312.lock ./packages/mcp-common pytest ruff
          python -m pip check
          python scripts/check_python_lock.py flowoox-mcp-common pytest ruff
      - name: Lint
        run: ruff check packages/mcp-common/src packages/mcp-common/tests
      - name: Test
        run: pytest -q packages/mcp-common/tests
      - name: Compile
        run: python -m compileall -q packages/mcp-common/src

  python:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: soulseek-mcp
            distribution: flowoox-mcp-soulseek
          - service: traxx-mcp
            distribution: flowoox-mcp-traxx
          - service: archive-mcp
            distribution: flowoox-mcp-archive
          - service: ad-mcp
            distribution: flowoox-mcp-ad
          - service: network-mcp
            distribution: flowoox-mcp-network
          - service: docker-mcp
            distribution: flowoox-mcp-docker
          - service: fortigate-mcp
            distribution: flowoox-mcp-fortigate
          - service: entra-mcp
            distribution: flowoox-mcp-entra
          - service: windows-mcp
            distribution: flowoox-mcp-windows
          - service: security-audit-mcp
            distribution: flowoox-mcp-security-audit
          - service: prtg-mcp
            distribution: flowoox-mcp-prtg
          - service: fileshare-mcp
            distribution: flowoox-mcp-fileshare
          - service: hyperv-mcp
            distribution: flowoox-mcp-hyperv
          - service: failovercluster-mcp
            distribution: flowoox-mcp-failovercluster
          - service: n8n-mcp
            distribution: flowoox-mcp-n8n
          - service: manageengine-mdm-mcp
            distribution: flowoox-mcp-manageengine-mdm
          - service: freshdesk-mcp
            distribution: flowoox-mcp-freshdesk
          - service: unifi-mcp
            distribution: flowoox-mcp-unifi
          - service: veeam-mcp
            distribution: flowoox-mcp-veeam
          - service: wazuh-mcp
            distribution: flowoox-mcp-wazuh
          - service: checkmk-mcp
            distribution: flowoox-mcp-checkmk
          - service: pki-mcp
            distribution: flowoox-mcp-pki
          - service: exchange-m365-mcp
            distribution: flowoox-mcp-exchange-m365
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: constraints/python312.lock
      - name: Install locked dependency graph
        run: |
          python -m pip install --constraint constraints/python312.lock --upgrade pip
          python -m pip install --constraint constraints/python312.lock ./packages/mcp-common
          python -m pip install --constraint constraints/python312.lock -e "./services/${{ matrix.service }}[dev]"
          python -m pip check
          python scripts/check_python_lock.py \
            flowoox-mcp-common \
            "${{ matrix.distribution }}" \
            pytest pytest-asyncio ruff
      - name: Audit resolved test graph
        if: matrix.service == 'archive-mcp'
        run: |
          python -m pip install 'pip-audit==2.10.1'
          python -m pip_audit --local --skip-editable
      - name: Lint
        run: ruff check packages/mcp-common/src "services/${{ matrix.service }}/src" "services/${{ matrix.service }}/tests" scripts/check_python_lock.py
      - name: Test
        run: pytest -q "services/${{ matrix.service }}/tests"
      - name: Tooling tests
        if: matrix.service == 'soulseek-mcp'
        run: pytest -q tests
      - name: Compile
        run: python -m compileall -q packages/mcp-common/src scripts "services/${{ matrix.service }}/src"

  docker:
    name: ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [soulseek-mcp, traxx-mcp, archive-mcp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bootstrap verified Buildx and BuildKit
        id: buildx
        shell: bash
        env:
          SECURE_BUILDX_BUILDER: mcp-lib-${{ matrix.service }}
        run: bash scripts/bootstrap-buildx-secure.sh
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.buildx.outputs.builder }}
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          github-token: ''
          tags: local/${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Remove ephemeral Buildx builder
        if: always()
        shell: bash
        env:
          BUILDER: ${{ steps.buildx.outputs.builder }}
        run: |
          if [[ -n "$BUILDER" ]]; then
            docker buildx rm --force "$BUILDER" || true
          fi
