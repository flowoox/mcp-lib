name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mcp-lib-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [soulseek-mcp, traxx-mcp, archive-mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./packages/mcp-common
          python -m pip install -e "./services/${{ matrix.service }}[dev]"
      - name: Lint
        run: ruff check packages/mcp-common/src "services/${{ matrix.service }}/src" "services/${{ matrix.service }}/tests"
      - name: Test
        run: pytest -q "services/${{ matrix.service }}/tests"
      - name: Tooling tests
        if: matrix.service == 'soulseek-mcp'
        run: pytest -q tests
      - name: Compile
        run: python -m compileall -q packages/mcp-common/src scripts "services/${{ matrix.service }}/src"

  docker:
    name: ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [soulseek-mcp, traxx-mcp, archive-mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: local/${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
