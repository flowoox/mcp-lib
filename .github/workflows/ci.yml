name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src

  docker:
    name: Docker and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: |
          cp .env.example .env
          docker compose config
      - name: Build Soulseek MCP image
        run: docker build --target soulseek -t mcp-soulseek:test .
      - name: Build Traxx MCP image
        run: docker build --target traxx -t mcp-traxx:test .
