name: Publish Traxx MCP

on:
  push:
    branches: [main]
    paths:
      - services/traxx-mcp/**
      - packages/mcp-common/**
      - .github/workflows/publish-traxx.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-traxx-mcp
  cancel-in-progress: false

env:
  VERSION: 0.1.0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/traxx-mcp/Dockerfile
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/flowoox/mcp-traxx:${{ env.VERSION }}
            ghcr.io/flowoox/mcp-traxx:latest
            ghcr.io/flowoox/mcp-traxx:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=traxx-mcp
          cache-to: type=gha,mode=max,scope=traxx-mcp
