name: Publish Traxx MCP

on:
  push:
    branches: [main]
    paths:
      - services/traxx-mcp/**
      - packages/mcp-common/**
      - scripts/bootstrap-buildx-secure.sh
      - .github/workflows/publish-traxx.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-traxx-mcp
  cancel-in-progress: false

env:
  VERSION: 0.3.13

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bootstrap verified Buildx and BuildKit
        id: buildx
        shell: bash
        run: bash scripts/bootstrap-buildx-secure.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Traxx MCP image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.buildx.outputs.builder }}
          context: .
          file: services/traxx-mcp/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          github-token: ''
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/flowoox/mcp-traxx:${{ env.VERSION }}
            ghcr.io/flowoox/mcp-traxx:latest
            ghcr.io/flowoox/mcp-traxx:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=traxx-mcp
          cache-to: type=gha,mode=max,scope=traxx-mcp
      - name: Record immutable published digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          echo "Published ghcr.io/flowoox/mcp-traxx@${IMAGE_DIGEST} from ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove ephemeral Buildx builder
        if: always()
        shell: bash
        env:
          BUILDER: ${{ steps.buildx.outputs.builder }}
        run: |
          set -euo pipefail
          if [[ -n "$BUILDER" ]]; then
            docker buildx rm --force "$BUILDER" || true
          fi
