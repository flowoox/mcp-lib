name: Normalize PR10 once

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: normalize-pr10-once
  cancel-in-progress: false

jobs:
  normalize:
    if: github.head_ref == 'fix/idempotent-media-pipeline-v0.3.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact Ruff fixes and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.2'
          ruff check --fix --unsafe-fixes \
            services/traxx-mcp/src/traxx_mcp/client.py \
            services/traxx-mcp/tests/test_metadata.py \
            services/traxx-mcp/tests/test_traxx_idempotency.py
          rm .github/workflows/normalize-pr10-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply Traxx MCP Ruff fixes'
          git push origin HEAD:${{ github.head_ref }}
