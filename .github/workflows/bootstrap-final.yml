name: Build final MCP source tree once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: bootstrap-mcp-final-v0.2.0
  cancel-in-progress: false

jobs:
  unpack:
    if: github.head_ref == 'feat/soulseek-webui-runtime-config-v0.2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and install final source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f bootstrap/part-000 ]; then
            echo 'Final source already installed.'
            exit 0
          fi
          cat bootstrap/part-* | base64 --decode > /tmp/mcp-lib-final.tgz
          echo '8bb2b563585021d00fe1b0eb98a61ce0df93837eb5062888a8008e6e471f1146  /tmp/mcp-lib-final.tgz' | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github/workflows -type f ! -name bootstrap-final.yml -delete
          tar -xzf /tmp/mcp-lib-final.tgz -C .
          rm -rf bootstrap
          test -f services/soulseek-mcp/src/soulseek_mcp/slskd_config.py
          test -f services/traxx-mcp/src/traxx_mcp/server.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Soulseek MCP web configuration v0.2.0'
          git push origin "HEAD:${{ github.head_ref }}"
