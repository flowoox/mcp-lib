name: Exchange Microsoft 365 MCP

on:
  pull_request:
    paths:
      - "services/exchange-m365-mcp/**"
      - "packages/mcp-common/**"
      - "constraints/python312.lock"
      - ".github/workflows/exchange-m365-mcp.yml"
  push:
    branches: [main]
    paths:
      - "services/exchange-m365-mcp/**"
      - "packages/mcp-common/**"
      - "constraints/python312.lock"
      - ".github/workflows/exchange-m365-mcp.yml"

permissions:
  contents: read

concurrency:
  group: exchange-m365-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: constraints/python312.lock
      - name: Install locked dependency graph
        run: |
          python -m pip install --constraint constraints/python312.lock --upgrade pip
          python -m pip install --constraint constraints/python312.lock ./packages/mcp-common
          python -m pip install --constraint constraints/python312.lock -e "./services/exchange-m365-mcp[dev]"
          python -m pip check
          python scripts/check_python_lock.py flowoox-mcp-common flowoox-mcp-exchange-m365 httpx pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check packages/mcp-common/src services/exchange-m365-mcp/src services/exchange-m365-mcp/tests
      - name: Test
        run: pytest -q services/exchange-m365-mcp/tests
      - name: Compile
        run: python -m compileall -q packages/mcp-common/src services/exchange-m365-mcp/src
