name: Current main audit snapshot

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'chore/current-main-audit-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Package source
        run: tar --exclude=.git -czf /tmp/mcp-lib-current-main.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-lib-current-main-source
          path: /tmp/mcp-lib-current-main.tgz
          if-no-files-found: error
          retention-days: 1
