name: MCP Service Template Security

on:
  pull_request:
    paths:
      - 'templates/service-template/**'
      - 'packages/mcp-common/**'
      - 'constraints/python312.lock'
      - '.github/workflows/template-security.yml'
  push:
    branches: [main]
    paths:
      - 'templates/service-template/**'
      - 'packages/mcp-common/**'
      - 'constraints/python312.lock'
      - '.github/workflows/template-security.yml'

permissions:
  contents: read

concurrency:
  group: mcp-template-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-security:
    name: template-security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: constraints/python312.lock
      - name: Install locked template graph
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --constraint constraints/python312.lock --upgrade pip
          python -m pip install --constraint constraints/python312.lock ./packages/mcp-common
          python -m pip install --constraint constraints/python312.lock -e './templates/service-template[dev]'
          python -m pip check
          python scripts/check_python_lock.py flowoox-mcp-common flowoox-mcp-example pytest ruff
      - name: Enforce immutable Action references
        run: python scripts/check_actions_pins.py
      - name: Lint
        run: ruff check templates/service-template/src templates/service-template/tests
      - name: Security and contract tests
        run: pytest -q templates/service-template/tests
      - name: Compile
        run: python -m compileall -q templates/service-template/src
