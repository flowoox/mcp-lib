name: Windows MCP

on:
  pull_request:
    paths:
      - "services/windows-mcp/**"
      - "packages/mcp-common/**"
      - "constraints/python312.lock"
      - ".github/workflows/windows-mcp.yml"
  push:
    branches: [main]
    paths:
      - "services/windows-mcp/**"
      - "packages/mcp-common/**"
      - "constraints/python312.lock"
      - ".github/workflows/windows-mcp.yml"

permissions:
  contents: read

concurrency:
  group: windows-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints/python312.lock
      - name: Install locked dependency graph
        run: |
          python -m pip install --constraint constraints/python312.lock --upgrade pip
          python -m pip install --constraint constraints/python312.lock ./packages/mcp-common
          python -m pip install --constraint constraints/python312.lock -e "./services/windows-mcp[dev]"
          python -m pip check
          python scripts/check_python_lock.py flowoox-mcp-common flowoox-mcp-windows pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check packages/mcp-common/src services/windows-mcp/src services/windows-mcp/tests
      - name: Test
        run: pytest -q services/windows-mcp/tests
      - name: Compile
        run: python -m compileall -q packages/mcp-common/src services/windows-mcp/src

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints/python312.lock
      - name: Install locked dependency graph
        shell: pwsh
        run: |
          python -m pip install --constraint constraints/python312.lock --upgrade pip
          python -m pip install --constraint constraints/python312.lock ./packages/mcp-common
          python -m pip install --constraint constraints/python312.lock -e "./services/windows-mcp[dev]"
          python -m pip check
          python scripts/check_python_lock.py flowoox-mcp-common flowoox-mcp-windows pytest pytest-asyncio ruff
      - name: Real PowerShell smoke test
        shell: pwsh
        run: pytest -q services/windows-mcp/tests/test_windows_smoke.py
      - name: Compile
        shell: pwsh
        run: python -m compileall -q packages/mcp-common/src services/windows-mcp/src
